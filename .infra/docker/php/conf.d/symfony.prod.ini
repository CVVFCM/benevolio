apc.enable_cli = 1
date.timezone = Europe/Paris
session.auto_start = Off
short_open_tag = Off
expose_php = Off

# https://symfony.com/doc/current/performance.html
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 256
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
opcache.preload_user = www-data
opcache.preload = /app/config/preload.php

; Signatures are accepted up to 16 MB (OrganizationSignature::MAX_FILE_SIZE), so PHP has to
; accept them too — at the 2M default the browser field just goes blank, with no error anyone
; can act on. post_max_size carries the file plus the rest of the form.
;
; memory_limit covers decoding one of those scans: GD holds an image at 4 bytes per pixel, so
; the 16-megapixel ceiling the entity enforces costs 64 MB, plus the scaled copy and the PNG
; buffer. It is the resize that needs the room, not the storing — what is stored is a 1 000 px
; image weighing tens of kilobytes.
;
; NOTE the leading ';'. This file's older comments use '#', which the ini parser tolerates only
; as long as the text happens to contain nothing it tries to parse: a '#' line with parentheses
; in it is a syntax error, and PHP then ignores the WHOLE file — every setting below it too.
upload_max_filesize = 16M
post_max_size = 20M
memory_limit = 256M
