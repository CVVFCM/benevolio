apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "benevolio.fullname" . }}-config
  labels:
    {{- include "benevolio.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.app.env | quote }}
  APP_DEBUG: {{ .Values.app.debug | quote }}
  SERVER_NAME: {{ .Values.app.serverName | quote }}
  DEFAULT_URI: {{ .Values.app.defaultUri | default (printf "https://%s" .Values.host) | quote }}
  {{- $mailFrom := required "app.mailFrom is required (the sender address, which must be a verified sender at the mail provider)" .Values.app.mailFrom }}
  {{- if not (regexMatch "^[^@[:space:]]+@[^@[:space:]]+\\.[^@[:space:]]+$" $mailFrom) }}
  {{- fail (printf "app.mailFrom must be a bare email address, got %q. A display name belongs nowhere here — the mailer already uses the association's name for that." $mailFrom) }}
  {{- end }}
  MAIL_FROM: {{ $mailFrom | quote }}
  # TLS terminates at the Gateway, so the pod is talked to over plain HTTP and Symfony
  # believes the whole site is insecure unless it is told to read the forwarded headers.
  # Consequences, all of them real and all of them silent: absolute URLs generated with
  # scheme `http://` (a form posting to one gets downgraded to GET by the edge redirect and
  # answered 405), and `cookie_secure: auto` deciding NOT to mark the session cookie Secure.
  #
  # `framework.trusted_proxies` defaults to this variable, so no application config is
  # needed. `private_ranges` covers the cluster network; it does mean anything already
  # inside the cluster could forge X-Forwarded-*, which is the accepted trade for not
  # pinning a Gateway pod CIDR that changes under us.
  SYMFONY_TRUSTED_PROXIES: {{ .Values.app.trustedProxies | quote }}
  # Object storage for the CERFA receipts. Endpoint and region are the Scaleway ones; the
  # bucket must exist already, since nothing here creates it. The key and secret are in the
  # Secret beside this. Defaults for all five live in config/packages/flysystem.yaml, but
  # they are the DEVELOPMENT ones — left unset here the application would sign requests to
  # AWS with the literal key "s3mock", so the three below are always sent.
  S3_ENDPOINT: {{ required "app.s3Endpoint is required (e.g. https://s3.fr-par.scw.cloud) — unset, receipts would be written to AWS with development credentials" .Values.app.s3Endpoint | quote }}
  S3_REGION: {{ .Values.app.s3Region | quote }}
  S3_BUCKET: {{ required "app.s3Bucket is required (the bucket must already exist)" .Values.app.s3Bucket | quote }}
  # Where the receipt overlay is rendered. Empty → the chart's own Gotenberg Service, which
  # is the point of shipping one; set it to reuse an instance elsewhere.
  {{- if .Values.app.gotenbergDsn }}
  GOTENBERG_DSN: {{ .Values.app.gotenbergDsn | quote }}
  {{- else if .Values.gotenberg.enabled }}
  GOTENBERG_DSN: {{ printf "http://%s-gotenberg:3000" (include "benevolio.fullname" .) | quote }}
  {{- else }}
  {{- fail "Either gotenberg.enabled must be true or app.gotenbergDsn must point at an instance: without one, validating a declaration cannot produce a receipt." }}
  {{- end }}
  # Bound FrankenPHP threads/workers (it otherwise sizes from the host core count and
  # OOMs the pod's memory limit). CLI pods (migrate) ignore these.
  FRANKENPHP_CONFIG: {{ printf "num_threads %d" (.Values.web.frankenphp.numThreads | int) | quote }}
  FRANKENPHP_WORKER_CONFIG: {{ printf "num %d" (.Values.web.frankenphp.numWorkers | int) | quote }}
