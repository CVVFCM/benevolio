{{- if .Values.database.backup.enabled }}
# A daily logical dump into a restic repository on Object Storage, in the application's own
# bucket beside the receipts. Deliberately not CNPG's own physical backup: the database is a
# few megabytes, a pg_dump restores into any PostgreSQL anywhere, and there is no
# point-in-time recovery to lose because none was asked for. The storage class keeps a single
# replica on one node, so this is the ONLY copy of the data that survives losing that disk.
#
# restic rather than loose files: the repository is encrypted (the bucket is private, the
# dump holds every volunteer's name and address all the same), deduplicated, and pruned by a
# real retention policy instead of by file age.
#
# Two containers sharing an emptyDir: pg_dump in the PostgreSQL image (same major as the
# server, which pg_dump requires), then restic.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "benevolio.fullname" . }}-db-backup
  labels:
    {{- include "benevolio.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-backup
spec:
  schedule: {{ .Values.database.backup.schedule | quote }}
  timeZone: {{ .Values.database.backup.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "benevolio.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: db-backup
        spec:
          restartPolicy: Never
          volumes:
            - name: dump
              emptyDir:
                sizeLimit: 512Mi
            - name: cache
              emptyDir:
                sizeLimit: 256Mi
          initContainers:
            - name: pg-dump
              image: {{ printf "%s:%v" .Values.database.image.repository .Values.database.postgresMajor | quote }}
              command:
                - sh
                - -c
                # Custom format, so pg_restore can still restore table by table, but
                # UNcompressed and under a fixed name: restic compresses and deduplicates
                # itself, and an already-compressed dump would leave it nothing to share
                # between two days.
                - pg_dump "$CNPG_APP_URI" --format=custom --compress=0 --no-owner --no-acl --file=/dump/benevolio.dump
              env:
                - name: CNPG_APP_URI
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "benevolio.database.clusterName" . }}-app
                      key: uri
              volumeMounts:
                - name: dump
                  mountPath: /dump
              resources:
                {{- toYaml .Values.database.backup.resources | nindent 16 }}
          containers:
            - name: restic
              image: {{ printf "%s:%s" .Values.database.backup.restic.repository .Values.database.backup.restic.tag | quote }}
              command:
                - sh
                - -ec
                # The first run creates the repository. `unlock` clears only a lock left by
                # a run that was killed, which would otherwise block every later one. `check`
                # reads the metadata, not the data: cheap at this size, and it is what says
                # the repository can still be restored from.
                - |
                  restic cat config >/dev/null 2>&1 || restic init
                  restic unlock
                  restic backup /dump/benevolio.dump --host benevolio --tag postgres
                  restic forget --host benevolio --tag postgres --prune \
                    --keep-daily {{ .Values.database.backup.keep.daily | int }} \
                    --keep-weekly {{ .Values.database.backup.keep.weekly | int }} \
                    --keep-monthly {{ .Values.database.backup.keep.monthly | int }}
                  restic check
              env:
                # $(VAR) expands only from variables declared EARLIER in this list, so the
                # three below come first.
                - name: S3_ENDPOINT
                  valueFrom:
                    configMapKeyRef:
                      name: {{ include "benevolio.fullname" . }}-config
                      key: S3_ENDPOINT
                - name: S3_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: {{ include "benevolio.fullname" . }}-config
                      key: S3_BUCKET
                - name: AWS_DEFAULT_REGION
                  valueFrom:
                    configMapKeyRef:
                      name: {{ include "benevolio.fullname" . }}-config
                      key: S3_REGION
                - name: RESTIC_REPOSITORY
                  value: {{ printf "s3:$(S3_ENDPOINT)/$(S3_BUCKET)/%s" (required "database.backup.repository is required: the repository's path inside the bucket, beside the receipts and never at its root" .Values.database.backup.repository | trimAll "/") | quote }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "benevolio.fullname" . }}-secret
                      key: S3_KEY
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "benevolio.fullname" . }}-secret
                      key: S3_SECRET
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "benevolio.fullname" . }}-secret
                      key: RESTIC_PASSWORD
                - name: RESTIC_CACHE_DIR
                  value: /cache
              volumeMounts:
                - name: dump
                  mountPath: /dump
                  readOnly: true
                - name: cache
                  mountPath: /cache
              resources:
                {{- toYaml .Values.database.backup.resources | nindent 16 }}
{{- end }}
