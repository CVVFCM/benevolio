{{- if .Values.gotenberg.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "benevolio.fullname" . }}-gotenberg
  labels:
    {{- include "benevolio.labels" . | nindent 4 }}
    app.kubernetes.io/component: gotenberg
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "benevolio.gotenberg.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "benevolio.gotenberg.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      containers:
        - name: gotenberg
          image: "{{ .Values.gotenberg.image.repository }}:{{ .Values.gotenberg.image.tag }}"
          imagePullPolicy: {{ .Values.gotenberg.image.pullPolicy }}
          # Chromium only. No LibreOffice route is used — the receipt is an HTML overlay —
          # and disabling it drops what this container idles at.
          args:
            - gotenberg
            - --libreoffice-disable-routes=true
            - --api-port=3000
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          # Gotenberg answers /health itself, which is the only reason this pod needs no
          # probe of ours: an unready converter must not receive a receipt to render.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.gotenberg.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.gotenberg.securityContext | nindent 12 }}
      {{- with .Values.gotenberg.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gotenberg.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
