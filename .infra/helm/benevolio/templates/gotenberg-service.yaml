{{- if .Values.gotenberg.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "benevolio.fullname" . }}-gotenberg
  labels:
    {{- include "benevolio.labels" . | nindent 4 }}
    app.kubernetes.io/component: gotenberg
spec:
  # ClusterIP, and no HTTPRoute anywhere near it: Gotenberg converts whatever HTML it is
  # handed, so an exposed instance is an open renderer pointed at the cluster's network.
  type: ClusterIP
  selector:
    {{- include "benevolio.gotenberg.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
{{- end }}
