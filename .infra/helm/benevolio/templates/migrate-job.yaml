{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "benevolio.fullname" . }}-migrate
  labels:
    {{- include "benevolio.labels" . | nindent 4 }}
  annotations:
    # post-install/post-upgrade: runs after the CNPG Cluster (a normal resource) has
    # been created. On a first install the -app Secret may not exist yet; the kubelet
    # retries until the operator writes it, and the entrypoint then waits for the
    # database to accept connections before migrating.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "benevolio.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - php
            - bin/console
            - doctrine:migrations:migrate
            - --no-interaction
            - --all-or-nothing
          # DATABASE_URL, from the Secret CNPG generates. See _helpers.tpl.
          env:
            {{- include "benevolio.database.env" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "benevolio.fullname" . }}-config
            - secretRef:
                name: {{ include "benevolio.fullname" . }}-secret
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
{{- end }}
