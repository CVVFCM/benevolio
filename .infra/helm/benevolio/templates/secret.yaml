apiVersion: v1
kind: Secret
metadata:
  name: {{ include "benevolio.fullname" . }}-secret
  labels:
    {{- include "benevolio.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.postgresql.enabled }}
  # Bundled DB: DATABASE_URL is composed in the container env from the Bitnami-generated
  # password (see "benevolio.dbEnv"), so it is omitted here.
  DATABASE_URL: {{ required "externalDatabase.url is required (full Doctrine DSN)" .Values.externalDatabase.url | quote }}
  {{- end }}
  APP_SECRET: {{ required "secrets.appSecret is required" .Values.secrets.appSecret | quote }}
  # Required on purpose. Left unset, Symfony falls back to null://null and every
  # confirmation mail is discarded without an error — the app would look healthy
  # while no declaration could ever be confirmed. Better to fail the deploy.
  {{- $mailerDsn := required "secrets.mailerDsn is required — without it confirmation mails are silently discarded and no declaration can be confirmed" .Values.secrets.mailerDsn }}
  # Being non-empty was not enough. A DSN carrying its own variable name —
  # "MAILER_DSN=brevo+api://…", the whole env line pasted in rather than the value —
  # satisfied `required`, deployed green, passed every probe, and then threw
  # "The mailer DSN must contain a scheme" on the volunteer's very first page load.
  # Check the shape here, where the deploy can still be stopped.
  {{- if not (regexMatch "^[a-zA-Z0-9]([a-zA-Z0-9+.-]*)://" $mailerDsn) }}
  {{- fail (printf "secrets.mailerDsn must start with a scheme such as brevo+api:// or smtp://, but starts with %q. The usual cause is pasting the whole env line, name included, instead of just the value." (trunc 20 $mailerDsn)) }}
  {{- end }}
  MAILER_DSN: {{ $mailerDsn | quote }}
