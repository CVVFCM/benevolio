apiVersion: v1
kind: Secret
metadata:
  name: {{ include "benevolio.fullname" . }}-secret
  labels:
    {{- include "benevolio.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.postgresql.enabled }}
  # Bundled DB: DATABASE_URL is composed in the container env from the Bitnami-generated
  # password (see "benevolio.dbEnv"), so it is omitted here.
  DATABASE_URL: {{ required "externalDatabase.url is required (full Doctrine DSN)" .Values.externalDatabase.url | quote }}
  {{- end }}
  APP_SECRET: {{ required "secrets.appSecret is required" .Values.secrets.appSecret | quote }}
  # Required on purpose. Left unset, Symfony falls back to null://null and every
  # confirmation mail is discarded without an error — the app would look healthy
  # while no declaration could ever be confirmed. Better to fail the deploy.
  MAILER_DSN: {{ required "secrets.mailerDsn is required — without it confirmation mails are silently discarded and no declaration can be confirmed" .Values.secrets.mailerDsn | quote }}
