apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "benevolio.fullname" . }}-web
  labels:
    {{- include "benevolio.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "benevolio.web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "benevolio.web.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll pods when config/secret change.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: admin
              containerPort: 2019
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "benevolio.fullname" . }}-config
            - secretRef:
                name: {{ include "benevolio.fullname" . }}-secret
          # /health, not /: this application routes nothing at the root, so the
          # original probe 404'd forever and the pod never turned ready. Not a
          # tenant URL either — see App\Controller\HealthController for why.
          #
          # Generous on purpose. docker-entrypoint waits for the database and then
          # applies migrations BEFORE FrankenPHP binds :80, so nothing answers here
          # until that finishes. The previous budget (20 × 3s = 1 min) expired
          # mid-wait and Kubernetes killed the pod, restarting the whole sequence —
          # a crash loop that looked like an application fault and was not.
          # 60 × 5s = 5 min covers a cold database plus a long migration.
          # Readiness and liveness below stay tight: this only widens the first start.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
