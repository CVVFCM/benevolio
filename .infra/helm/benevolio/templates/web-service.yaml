apiVersion: v1
kind: Service
metadata:
  name: {{ include "benevolio.fullname" . }}-web
  labels:
    {{- include "benevolio.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    {{- include "benevolio.web.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
