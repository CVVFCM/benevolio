# Default values for benevolio.

image:
  # Fully qualified: OKE's runtime enforces short-name mode and rejects an
  # unqualified name as ambiguous. The package is public, so no pull secret.
  repository: ghcr.io/cvvfcm/benevolio/app
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

# FrankenPHP web server (serves the Symfony app).
# Resources: memory request==limit (Guaranteed memory QoS); cpu request only, no cpu
# limit (avoids CFS throttling). Starting points — tune from `kubectl top`.
web:
  replicaCount: 1
  # 768Mi, not 512Mi, because of one request: decoding an uploaded signature. GD holds an
  # image at 4 bytes per pixel, so the 16-megapixel ceiling the application enforces costs
  # 64 MB, plus the scaled copy and the PNG buffer — and php.ini allows 256M per request to
  # cover it. Two workers doing that at once against a 512Mi limit is an OOMKill, which
  # Kubernetes reports as a crash rather than as "your scan was too big".
  #
  # Only the upload path is heavy; what gets STORED is a 1 000 px image of a few tens of
  # kilobytes, so serving pages and issuing receipts stay where they were.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  # FrankenPHP sizes threads/workers from the HOST core count by default (it doesn't see
  # the cgroup CPU limit) — on a big node that spawns far too many PHP workers and OOMs
  # the memory limit. Pin small explicit counts that fit the resources above.
  frankenphp:
    numThreads: 4
    numWorkers: 2
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Public hostname served by the app.
host: benevolat.cvvfcm.fr

# Non-secret application configuration (rendered into a ConfigMap).
app:
  env: prod
  debug: "false"
  # ":80" → plain HTTP only; Caddy will not attempt auto-HTTPS (TLS is at the Gateway).
  serverName: ":80"
  # Which proxies Symfony believes about X-Forwarded-Proto / -For / -Host.
  #
  # Required precisely BECAUSE serverName is ":80": the pod only ever sees plain HTTP, so
  # without this Symfony generates `http://` URLs and leaves the session cookie unmarked as
  # Secure. `private_ranges` trusts the cluster network — anything already inside the cluster
  # could forge those headers, which is the accepted trade for not pinning a Gateway pod CIDR
  # that moves. Narrow it to a specific CIDR if that ever becomes worth the maintenance.
  trustedProxies: private_ranges
  # Base URL for URLs generated in CLI context. Empty → derived as https://<host>.
  defaultUri: ""
  # Sender for the confirmation mails. A literal, deliberately not derived from
  # `host`: this address has to be a verified sender at whatever relay
  # secrets.mailerDsn points at, and a value the chart invented for itself would
  # not be — the mail would be accepted here and dropped there.
  mailFrom: benevolat@cvvfcm.fr
  # Object storage for the CERFA receipts (Scaleway, Paris). The endpoint and region are
  # fixed; the bucket has to exist already — nothing in this chart creates it. The key and
  # secret are in `secrets` below, and the variable names match cvvfcm-v4, so the same
  # SCW_ACCESS_KEY / SCW_SECRET_KEY organisation secrets serve both.
  s3Endpoint: https://s3.fr-par.scw.cloud
  s3Region: fr-par
  s3Bucket: benevolio
  # Where the receipt overlay is rendered. Empty → the Gotenberg Service this chart
  # deploys. Set it to point at an instance that already exists somewhere else.
  gotenbergDsn: ""

# Gotenberg, which turns the receipt's HTML overlay into the PDF that is then stamped onto
# the official CERFA with qpdf. In-cluster because it is a hard dependency of validating a
# declaration, and an external one is a second thing to keep alive.
#
# Chromium is the whole cost here: it idles around 100 MiB and spikes while converting.
# ClusterIP only — see the Service. Never expose it: Gotenberg renders whatever HTML it is
# handed, from inside the cluster network.
gotenberg:
  enabled: true
  image:
    repository: docker.io/gotenberg/gotenberg
    tag: "8"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # The image runs as its own unprivileged user (gotenberg, uid 1001) and needs a writable
  # /tmp for Chromium, so no runAsUser is forced here and the root filesystem is left
  # writable.
  securityContext: {}
  nodeSelector: {}
  tolerations: []

# PostgreSQL, always external. The chart used to be able to run its own via the
# Bitnami subchart; that is gone, so there is exactly one way to point this at a
# database and no second path to keep working.
database:
  # Full Doctrine DSN, supplied by CD from the DATABASE_URL secret, e.g.
  #   postgresql://benevolio:secret@db.internal:5432/benevolio?serverVersion=18&charset=utf8
  # Required — the chart refuses to render without it.
  url: ""

# Secret values. Supply via --set, a values.local.yaml, or a sealed-secret.
secrets:
  appSecret: ""
  # Full Symfony mailer DSN, e.g. smtp://user:pass@relay.example.org:587.
  # REQUIRED — the chart refuses to render without it. A declaration is not final
  # until the volunteer opens a link sent by mail, so an app that cannot send is
  # an app in which nothing can be declared. The default null://null would make
  # that failure silent, which is precisely what must not happen in production.
  mailerDsn: ""
  # Scaleway Object Storage credentials (SCW_ACCESS_KEY / SCW_SECRET_KEY in CD).
  # REQUIRED, for the same reason as mailerDsn: config/packages/flysystem.yaml carries
  # development defaults, so leaving these empty does not fail — it signs a request to AWS
  # with the literal key "s3mock" and the receipt is lost. A refused deploy is better.
  s3Key: ""
  s3Secret: ""

# Database migration job (Helm post-install/post-upgrade hook).
migrations:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Pod-level security context. The image bakes EXTERNAL_USER_ID (default 1000 =
# www-data); keep runAsUser aligned with the build arg.
podSecurityContext:
  runAsUser: 33
  runAsGroup: 33
  fsGroup: 33

securityContext: {}

serviceAccount:
  create: false
  name: ""
