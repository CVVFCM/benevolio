services:
  php:
    image: ${IMAGE_PREFIX:-cvvfcm/benevolio/}app:${APP_VERSION:-latest}
    depends_on: [ database ]
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}, php:80
      APP_SECRET: ${APP_SECRET:-!ChangeMe!}
      DATABASE_URL: '${DATABASE_URL:-postgresql://${DATABASE_USER:-benevolio}:${DATABASE_PASSWORD:-benevolio}@database:5432/${DATABASE_DB:-benevolio}?serverVersion=18&charset=utf8}'
    build:
      context: .
      target: app
      args:
        EXTERNAL_USER_ID: ${EXTERNAL_USER_ID}
    ports:
      - target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp

  database:
    image: postgres:18-trixie
    volumes: [ 'database-data:/var/lib/postgresql' ]
    healthcheck:
      test: [ "CMD", "pg_isready", "-d", "${POSTGRES_DB:-benevolio}", "-U", "${POSTGRES_USER:-benevolio}" ]
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      - POSTGRES_DB=${DATABASE_DB:-benevolio}
      - POSTGRES_USER=${DATABASE_USER:-benevolio}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-benevolio}

volumes:
  database-data: ~
