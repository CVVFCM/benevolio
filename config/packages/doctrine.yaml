parameters:
    env(DATABASE_URL): 'postgresql://app:!ChangeMe!@127.0.0.1:5432/app?serverVersion=18&charset=utf8'

doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '18'

        profiling_collect_backtrace: '%kernel.debug%'
        # Entity ids are application-generated UUID v7 (see src/Entity/Organization.php),
        # which PostgreSQL stores in its native uuid column type.
        types:
            uuid: Symfony\Bridge\Doctrine\Types\UuidType
            # App\ValueObject\Email in a single column — see App\Doctrine\Type\EmailType.
            app_email: App\Doctrine\Type\EmailType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
            # #[ORM\Embeddable] value objects live with the other value objects,
            # not under src/Entity. Classes here without mapping attributes (Email,
            # which is a DBAL type instead) are transient and simply ignored.
            AppValueObject:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/ValueObject'
                prefix: 'App\ValueObject'
        filters:
            # Multi-tenant isolation. Declared disabled on purpose: it carries a
            # per-request parameter, and App\Tenant\TenantRequestListener arms it
            # with the resolved organization (or disables it when there is none).
            # Consequence: the filter is OFF in CLI context.
            organization:
                class: App\Doctrine\Filter\OrganizationFilter
                enabled: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
