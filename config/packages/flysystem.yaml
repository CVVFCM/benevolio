# Where generated CERFA receipts live.
#
# One storage, configured by DSN so the same code faces a local s3mock in development
# and Scaleway Object Storage in production — see compose.override.yaml for the former
# and the prod environment secret for the latter.
flysystem:
    storages:
        receipts.storage:
            # The discoverable format (adapter name as the key). The older
            # `adapter:`/`options:` pair is deprecated since flysystem-bundle 3.5.
            asyncaws:
                client: 'receipts.s3_client'
                bucket: '%env(RECEIPTS_BUCKET)%'

services:
    # Built by hand rather than from a bare s3:// DSN: Scaleway needs an explicit
    # endpoint and region and path-style addressing, none of which the DSN form
    # expresses. s3mock needs exactly the same, which is why one client serves both.
    receipts.s3_client:
        class: AsyncAws\S3\S3Client
        arguments:
            -   endpoint: '%env(RECEIPTS_ENDPOINT)%'
                region: '%env(RECEIPTS_REGION)%'
                accessKeyId: '%env(RECEIPTS_ACCESS_KEY)%'
                accessKeySecret: '%env(RECEIPTS_SECRET_KEY)%'
                pathStyleEndpoint: true
