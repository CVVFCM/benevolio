security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Volunteers have no account: the only users are back-office accounts.
        app_users:
            entity:
                class: App\Entity\User
                property: email

    role_hierarchy:
        # A platform super-admin can do anything an organization admin can.
        ROLE_SUPER_ADMIN: [ROLE_ADMIN]

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_users
            form_login:
                login_path: login
                check_path: login
                # config/packages/csrf.yaml already declares the "authenticate"
                # stateless CSRF token id that the login form must submit.
                enable_csrf: true
            logout:
                # A URL path, not a route name: the security route loader in
                # config/routes/security.yaml turns it into the "logout" route.
                path: /logout
                target: login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # one week
                samesite: lax

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        # The volunteer declaration form. Volunteers have no account, so this whole
        # prefix is anonymous by design; the tenant comes from the {organizationSlug}
        # in the URL (see App\Tenant\UrlPrefixTenantResolver).
        - { path: ^/a/, roles: PUBLIC_ACCESS }
        # The platform backoffice manages organizations across every tenant, so it
        # runs with the Doctrine tenant filter disabled (a super-admin resolves to
        # no organization — see App\Tenant\TenantRequestListener). Super-admins only.
        - { path: ^/platform, roles: ROLE_SUPER_ADMIN }
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
