security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Volunteers have no account: the only users are back-office accounts.
        app_users:
            entity:
                class: App\Entity\User
                property: email

    role_hierarchy:
        # A platform super-admin can do anything an organization admin can.
        ROLE_SUPER_ADMIN: [ROLE_ADMIN]
        # An association's owner is one of its admins, identified as the first.
        ROLE_OWNER: [ROLE_ADMIN]

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_users
            form_login:
                login_path: login
                check_path: login
                # config/packages/csrf.yaml already declares the "authenticate"
                # stateless CSRF token id that the login form must submit.
                enable_csrf: true
                # Not `/`, which is the public home page: see App\Controller\BackofficeController.
                default_target_path: backoffice
            # Accounts are created without a password and are emailed one of these
            # instead, as is anyone who forgot theirs — see App\User\LoginLinkMailer.
            # Signed with the password hash, so a link dies the moment a password is
            # set or changed. No max_uses: it needs a cache shared by every pod, and a
            # mail scanner prefetching the URL would burn it before the user clicks.
            login_link:
                check_route: login_link_check
                signature_properties: [id, email, password]
                # The forgotten-password lifetime; invitations override it per link.
                lifetime: 3600
                success_handler: App\Security\LoginLinkSuccessHandler
            # A super-admin may act as an association's account, to see what they see.
            # The role is a voter attribute, not a role: App\Security\Voter\ImpersonationVoter
            # decides per target (association accounts only, never a super-admin).
            # Symfony checks no CSRF on _switch_user, so App\Security\ImpersonationListener
            # demands a POST with a token, and logs every start and exit.
            switch_user:
                role: IMPERSONATE_USER
                target_route: admin
            logout:
                # A URL path, not a route name: the security route loader in
                # config/routes/security.yaml turns it into the "logout" route.
                path: /logout
                target: login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # one week
                samesite: lax

    # Note: Only the *first* matching rule is applied
    access_control:
        # Probed by Kubernetes, which carries no credentials and must not be
        # redirected to the login form. See App\Controller\HealthController.
        - { path: ^/health$, roles: PUBLIC_ACCESS }
        # The public home page. Must stay anonymous: see App\Controller\HomeController.
        - { path: ^/$, roles: PUBLIC_ACCESS }
        # Sends a logged-in account to its back office: App\Controller\BackofficeController.
        - { path: ^/espace$, roles: ROLE_ADMIN }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        # Where an emailed login link is checked, and where one is asked for.
        - { path: ^/login/lien$, roles: PUBLIC_ACCESS }
        - { path: ^/mot-de-passe-oublie$, roles: PUBLIC_ACCESS }
        # Choosing a password needs an account to choose it for: reached after a
        # login link (App\Security\ChoosePasswordEnforcer sends you here). Fully:
        # it changes a password without asking for the old one, so a remember-me
        # cookie alone must not reach it.
        # Never while impersonating: a super-admin must not set someone else's password,
        # which is the whole point of the invitation link.
        - { path: ^/mot-de-passe$, allow_if: "is_fully_authenticated() and !is_granted('IS_IMPERSONATOR')" }
        # The volunteer declaration form. Volunteers have no account, so this whole
        # prefix is anonymous by design; the tenant comes from the {organizationSlug}
        # in the URL (see App\Tenant\UrlPrefixTenantResolver).
        - { path: ^/a/, roles: PUBLIC_ACCESS }
        # The platform backoffice manages organizations across every tenant, so it
        # runs with the Doctrine tenant filter disabled (a super-admin resolves to
        # no organization — see App\Tenant\TenantRequestListener). Super-admins only.
        - { path: ^/platform, roles: ROLE_SUPER_ADMIN }
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
