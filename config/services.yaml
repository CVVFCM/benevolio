# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Envelope sender for every mail the platform sends. Not an association's own
    # address: the platform sends on their behalf, and spoofing their domain would
    # land the mail in spam.
    app.mail_from: '%env(MAIL_FROM)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Controllers do not extend AbstractController (see AGENTS.md), so they get
    # their collaborators through the constructor. This tag lets Symfony resolve
    # controller *action* arguments (Request, entities, #[MapQueryParameter], …)
    # for services used as controllers.
    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    # Imagine resizes an uploaded signature down to what a receipt can carry — see
    # App\Organization\SignatureFactory. GD and not Imagick: ext-gd is what the image installs,
    # and this is one thumbnail of one PNG, not an image pipeline. The alias is what lets the
    # factory depend on the interface, so swapping drivers is this line and nothing else.
    Imagine\Gd\Imagine: ~
    Imagine\Image\ImagineInterface: '@Imagine\Gd\Imagine'

    # The Gotenberg endpoint and the shipped CERFA are deployment facts, not something
    # the classes should discover for themselves.
    App\Receipt\GotenbergClient:
        arguments:
            $baseUri: '%env(GOTENBERG_DSN)%'

    App\Receipt\ReceiptGenerator:
        arguments:
            # The official form, shipped in the repository. See resources/cerfa/README.md
            # for its provenance and what to re-measure if it is ever replaced.
            $formPath: '%kernel.project_dir%/resources/cerfa/2041-rd_11580-05.pdf'

    # TenantContext holds per-request state in a shared service. Under FrankenPHP
    # worker mode the container survives between requests, so it must be reset or
    # request N would inherit request N-1's tenant.
    App\Tenant\TenantContext:
        tags:
            - { name: kernel.reset, method: reset }

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
